# Workers + Static Assets + D1
name = "kitchen-app"
main = "src/index.js"
compatibility_date = "2024-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# همه درخواست‌های /api/* اول به Worker می‌روند
run_worker_first = ["/api/*"]

# ===== مهم: D1 را وصل کنید =====
# 1) در Dashboard یک D1 بسازید (مثلاً kitchen-inventory)
# 2) Settings → Bindings → D1 → Variable name دقیقاً: DB
# 3) یا database_id را اینجا بگذارید و از CLI دیپلوی کنید:
#
# [[d1_databases]]
# binding = "DB"
# database_name = "kitchen-inventory"
# database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
