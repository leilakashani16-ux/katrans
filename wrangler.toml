# Workers + Static Assets + D1
name = "kitchen-app"
main = "src/index.js"
compatibility_date = "2024-11-01"
#
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# true = همه درخواست‌ها اول به Worker می‌روند (نسخه 3.x فقط boolean می‌پذیرد)
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "kitchen-inventory"
database_id = "327510ab-2de3-4292-b01e-a1332cf970e1"
