<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#0d4d2e" />
  <meta name="description" content="سیستم گردش مواد اولیه و تولید — غذای انصار" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="غذای انصار" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-192.png" />
  <title>غذای انصار — سیستم گردش مواد</title>
  <!-- CSS محلی اول — بدون اینترنت خارجی هم UI کار می‌کند -->
  <link rel="stylesheet" href="css/app-core.css" />
  <!-- فونت اختیاری؛ اگر گوگل بلاک باشد Tahoma استفاده می‌شود -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
  <!-- Tailwind اختیاری (اگر CDN باز باشد ظاهر کامل‌تر می‌شود) -->
  <script>
    window.__cdnOk = false;
    (function () {
      var s = document.createElement('script');
      s.src = 'https://cdn.tailwindcss.com';
      s.async = true;
      s.onload = function () {
        window.__cdnOk = true;
        try {
          if (window.tailwind) {
            tailwind.config = {
              theme: {
                extend: {
                  fontFamily: { sans: ['Vazirmatn', 'Tahoma', 'system-ui', 'sans-serif'] },
                  colors: {
                    brand: {
                      300: '#6ee7b7', 400: '#34d399', 500: '#10b981', 600: '#059669', 700: '#047857',
                      800: '#0a3d24', 900: '#072e1b'
                    },
                    cream: { 100: '#f7f3e8', 200: '#ebe4d0', 300: '#d4c9a8' },
                    accent: { 400: '#a78bfa', 500: '#8b5cf6', 600: '#7c3aed' },
                    slate: { 850: '#141c2b', 950: '#070b14' }
                  }
                }
              }
            };
          }
        } catch (e) {}
      };
      s.onerror = function () {
        var w = document.getElementById('cdn-warn');
        if (w) w.classList.add('show');
      };
      setTimeout(function () {
        if (!window.__cdnOk) {
          var w = document.getElementById('cdn-warn');
          if (w) w.classList.add('show');
        }
      }, 8000);
      document.head.appendChild(s);
    })();
  </script>
  <!-- کتابخانه‌های گزارش — غیرمسدودکننده -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/jalaali-js@1.2.7/dist/jalaali.min.js"></script>
  <style>
    * { font-family: 'Vazirmatn', system-ui, sans-serif; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #071a10;
      background-image:
        linear-gradient(180deg, rgba(7,26,16,0.90) 0%, rgba(10,40,24,0.92) 50%, rgba(7,26,16,0.95) 100%),
        url('bg-ansar.jpg'); /* optional */
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.4;
    }
    #login-screen, #app, #install-banner, #toast, #modal-root { position: relative; z-index: 1; }

    .glass {
      background: linear-gradient(145deg, rgba(22,30,48,0.85), rgba(15,22,38,0.75));
      backdrop-filter: blur(20px) saturate(1.3);
      -webkit-backdrop-filter: blur(20px) saturate(1.3);
      border: 1px solid rgba(148,163,184,0.12);
      box-shadow: 0 8px 32px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.04);
    }
    .glass-card {
      background: linear-gradient(160deg, rgba(24,33,52,0.7), rgba(16,24,40,0.55));
      backdrop-filter: blur(14px);
      border: 1px solid rgba(148,163,184,0.1);
      box-shadow: 0 4px 24px rgba(0,0,0,0.2);
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .glass-card:hover {
      border-color: rgba(16,185,129,0.25);
      box-shadow: 0 8px 32px rgba(16,185,129,0.08);
    }

    .input-field {
      width: 100%; padding: 0.7rem 1rem; border-radius: 0.85rem;
      background: rgba(8,12,22,0.65);
      border: 1px solid rgba(71,85,105,0.45);
      color: #f1f5f9; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-field:focus {
      outline: none; border-color: rgba(16,185,129,0.6);
      box-shadow: 0 0 0 3px rgba(16,185,129,0.15);
    }
    .input-field::placeholder { color: #64748b; }

    .btn-primary {
      padding: 0.7rem 1.35rem; border-radius: 0.85rem; font-weight: 600;
      background: linear-gradient(135deg, #0d4d2e 0%, #1a9b55 50%, #34d389 100%);
      color: white; border: none; cursor: pointer;
      box-shadow: 0 4px 20px rgba(13, 77, 46, 0.45), inset 0 1px 0 rgba(255,255,255,0.12);
      transition: transform 0.15s, box-shadow 0.2s, filter 0.2s;
    }
    .btn-primary:hover { filter: brightness(1.08); box-shadow: 0 6px 28px rgba(16,185,129,0.45); }
    .btn-primary:active { transform: scale(0.97); }

    .btn-secondary {
      padding: 0.65rem 1.2rem; border-radius: 0.85rem; cursor: pointer;
      background: rgba(30,41,59,0.7); color: #e2e8f0;
      border: 1px solid rgba(71,85,105,0.5); transition: all 0.2s;
    }
    .btn-secondary:hover { background: rgba(51,65,85,0.85); border-color: rgba(148,163,184,0.3); }
    .btn-danger { padding: 0.5rem 1rem; border-radius: 0.6rem; background: linear-gradient(135deg,#dc2626,#ef4444); color: white; border: none; cursor: pointer; }
    .btn-ghost { padding: 0.35rem 0.7rem; border-radius: 0.5rem; color: #94a3b8; background: transparent; border: none; cursor: pointer; }
    .btn-ghost:hover { background: rgba(51,65,85,0.5); color: #e2e8f0; }

    .table-wrap { overflow-x: auto; border-radius: 1rem; }
    table.data { width: 100%; border-collapse: collapse; }
    table.data th {
      padding: 0.85rem 1rem; text-align: right; font-size: 0.7rem; font-weight: 700;
      color: #64748b; text-transform: uppercase; letter-spacing: 0.04em;
      background: rgba(8,12,22,0.6); position: sticky; top: 0; backdrop-filter: blur(8px);
    }
    table.data td { padding: 0.8rem 1rem; font-size: 0.875rem; color: #e2e8f0; border-top: 1px solid rgba(51,65,85,0.35); }
    table.data tr { transition: background 0.15s; }
    table.data tr:hover td { background: rgba(16,185,129,0.06); }

    .badge { display: inline-flex; align-items: center; padding: 0.15rem 0.65rem; border-radius: 9999px; font-size: 0.7rem; font-weight: 600; letter-spacing: 0.02em; }
    .badge-ok { background: rgba(16,185,129,0.15); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.25); }
    .badge-warn { background: rgba(245,158,11,0.15); color: #fcd34d; border: 1px solid rgba(245,158,11,0.25); }
    .badge-danger { background: rgba(239,68,68,0.15); color: #fca5a5; border: 1px solid rgba(239,68,68,0.25); }

    .sidebar-link {
      display: flex; align-items: center; gap: 0.75rem; padding: 0.7rem 1rem;
      border-radius: 0.85rem; color: #94a3b8; cursor: pointer; transition: all 0.2s; border: 1px solid transparent;
    }
    .sidebar-link:hover { background: rgba(51,65,85,0.4); color: #f1f5f9; }
    .sidebar-link.active {
      background: linear-gradient(135deg, rgba(16,185,129,0.2), rgba(16,185,129,0.08));
      color: #6ee7b7; border-color: rgba(16,185,129,0.3);
      box-shadow: 0 0 20px rgba(16,185,129,0.1);
    }

    .stat-card {
      background: linear-gradient(160deg, rgba(24,33,52,0.75), rgba(16,24,40,0.5));
      backdrop-filter: blur(14px);
      border: 1px solid rgba(148,163,184,0.1);
      border-radius: 1.15rem; padding: 1.35rem;
      display: flex; flex-direction: column; gap: 0.35rem;
      position: relative; overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
    }
    .stat-card::after {
      content: ''; position: absolute; top: -40%; left: -20%; width: 60%; height: 80%;
      background: radial-gradient(circle, rgba(16,185,129,0.12), transparent 70%);
      pointer-events: none;
    }
    .stat-card:hover { transform: translateY(-2px); border-color: rgba(16,185,129,0.3); }

    .modal-overlay {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(0,0,0,0.65); backdrop-filter: blur(8px);
      display: flex; align-items: flex-end; justify-content: center; padding: 0;
      overflow-y: auto; -webkit-overflow-scrolling: touch;
    }
    @media (min-width: 640px) {
      .modal-overlay { align-items: center; padding: 1rem; }
    }
    .modal {
      background: linear-gradient(160deg, rgba(22,30,48,0.97), rgba(12,18,32,0.95));
      backdrop-filter: blur(24px);
      border: 1px solid rgba(148,163,184,0.15);
      border-radius: 1.25rem 1.25rem 0 0; padding: 1.25rem 1.25rem 1.5rem;
      width: 100%; max-width: 32rem;
      max-height: min(92vh, 900px);
      overflow-y: auto; -webkit-overflow-scrolling: touch;
      box-shadow: 0 25px 60px rgba(0,0,0,0.55), 0 0 0 1px rgba(16,185,129,0.08);
      margin: 0 auto;
    }
    @media (min-width: 640px) {
      .modal { border-radius: 1.25rem; padding: 1.75rem; max-height: 90vh; }
    }
    .modal-sticky-actions {
      position: sticky; bottom: 0; z-index: 2;
      background: linear-gradient(180deg, transparent, rgba(12,18,32,0.98) 28%);
      padding-top: 1rem; margin-top: 0.5rem;
      padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
    }
    .tf-rows-scroll {
      max-height: 42vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
      padding-right: 2px;
    }
    .toast {
      position: fixed; bottom: 1.5rem; left: 1.5rem; z-index: 100;
      padding: 0.85rem 1.35rem; border-radius: 0.9rem;
      box-shadow: 0 12px 40px rgba(0,0,0,0.4); font-size: 0.875rem; font-weight: 500;
      transition: all 0.3s; backdrop-filter: blur(12px);
    }
    .alert-banner {
      background: linear-gradient(105deg, rgba(239,68,68,0.12), rgba(245,158,11,0.1));
      border: 1px solid rgba(239,68,68,0.28);
      border-radius: 1.1rem; padding: 1.1rem 1.35rem;
      box-shadow: 0 4px 24px rgba(239,68,68,0.08);
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

    .fade-in { animation: fadeIn 0.35s cubic-bezier(0.22,1,0.36,1); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(16,185,129,0.2); }
      50% { box-shadow: 0 0 36px rgba(16,185,129,0.4); }
    }
    .logo-glow { animation: pulse-glow 3s ease-in-out infinite; }

    .filter-bar { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1rem; align-items: center; }
    .filter-bar input, .filter-bar select { max-width: 180px; }

    #login-screen .glass {
      border: 1px solid rgba(16,185,129,0.15);
      box-shadow: 0 25px 80px rgba(0,0,0,0.5), 0 0 60px rgba(16,185,129,0.08);
    }

    /* نوار بالای موبایل — وضعیت اتصال + خروج */
    #mobile-topbar {
      display: none;
      position: fixed; top: 0; left: 0; right: 0; z-index: 45;
      background: rgba(8,12,22,0.94); backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(148,163,184,0.12);
      padding: 0.5rem 0.75rem;
      padding-top: max(0.5rem, env(safe-area-inset-top));
      align-items: center; justify-content: space-between; gap: 0.5rem;
    }
    #mobile-topbar .conn-status {
      font-size: 0.7rem; font-weight: 600; display: flex; align-items: center; gap: 0.35rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #mobile-topbar .conn-status .dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    #mobile-topbar .conn-status.cloud .dot { background: #34d389; box-shadow: 0 0 8px #34d389; }
    #mobile-topbar .conn-status.local .dot { background: #fbbf24; }
    #mobile-topbar .conn-status.offline .dot { background: #ef4444; }
    #mobile-topbar .mob-actions { display: flex; align-items: center; gap: 0.4rem; flex-shrink: 0; }
    #mobile-topbar .mob-actions button {
      padding: 0.35rem 0.7rem; border-radius: 0.55rem; font-size: 0.72rem; font-weight: 600;
      border: 1px solid rgba(71,85,105,0.5); background: rgba(30,41,59,0.8); color: #e2e8f0;
      cursor: pointer;
    }
    #mobile-topbar .mob-actions button.logout-btn {
      background: linear-gradient(135deg,#dc2626,#ef4444); border: none; color: white;
    }

    @media (max-width: 768px) {
      #sidebar {
        width: 100% !important; height: auto !important;
        top: auto !important; bottom: 0 !important; right: 0 !important; left: 0 !important;
        flex-direction: row !important; border-left: none !important;
        border-top: 1px solid rgba(148,163,184,0.12);
        z-index: 40; padding-bottom: env(safe-area-inset-bottom);
        background: rgba(8,12,22,0.92) !important; backdrop-filter: blur(20px);
      }
      /* لوگو و بخش پایین سایدبار روی موبایل مخفی — به جاش نوار بالا */
      #sidebar > div:first-child, #sidebar > div:last-child { display: none !important; }
      #nav-links {
        display: flex !important; flex-direction: row !important; overflow-x: auto !important;
        width: 100%; padding: 0.4rem !important; gap: 0.15rem; -webkit-overflow-scrolling: touch;
      }
      .sidebar-link {
        flex-direction: column !important; font-size: 0.62rem !important;
        padding: 0.45rem 0.5rem !important; gap: 0.15rem !important;
        white-space: nowrap; min-width: 3.4rem; text-align: center;
      }
      .sidebar-link span:first-child { font-size: 1.15rem; }
      main.flex-1 {
        margin-right: 0 !important;
        margin-bottom: 4.5rem !important;
        margin-top: 3.2rem !important;
        padding: 1rem !important;
      }
      #mobile-topbar { display: flex !important; }
      body:has(#login-screen:not(.hidden)) #mobile-topbar { display: none !important; }

      /* فونت‌ها و فاصله‌ها روی موبایل جمع‌وجورتر */
      html { font-size: 14px; }
      main.flex-1 { padding: 0.75rem !important; }
      h1, #page-content h1 { font-size: 1.15rem !important; line-height: 1.35 !important; }
      h2, #page-content h2 { font-size: 1rem !important; }
      h3, #page-content h3 { font-size: 0.95rem !important; }
      table.data th { padding: 0.5rem 0.55rem !important; font-size: 0.62rem !important; }
      table.data td { padding: 0.45rem 0.55rem !important; font-size: 0.75rem !important; }
      .stat-card { padding: 0.85rem !important; border-radius: 0.9rem !important; }
      .stat-card .text-2xl, .stat-card .text-3xl { font-size: 1.25rem !important; }
      .badge { font-size: 0.62rem !important; padding: 0.1rem 0.45rem !important; }
      .btn-primary, .btn-secondary { padding: 0.55rem 0.9rem !important; font-size: 0.8rem !important; }
      .input-field { padding: 0.55rem 0.75rem !important; font-size: 0.875rem !important; }
      .filter-bar { gap: 0.45rem !important; margin-bottom: 0.65rem !important; }
      .filter-bar input, .filter-bar select { max-width: 140px; font-size: 0.8rem !important; }
      .glass-card { padding: 0.85rem !important; }
      .modal { padding: 1.1rem !important; max-width: 100vw; max-height: 92vh !important; }
      #page-content p, #page-content .text-sm { font-size: 0.8rem !important; }
      #page-content .text-xs { font-size: 0.7rem !important; }
      #page-content .text-lg { font-size: 0.95rem !important; }
      #page-content .text-xl { font-size: 1.05rem !important; }
      #page-content .text-2xl { font-size: 1.2rem !important; }
    }
  
    /* حالت شیفت شب — خوانایی روی تبلت آشپزخانه */
    html.night-shift body {
      background: #030806 !important;
      background-image: none !important;
    }
    html.night-shift .glass, html.night-shift .glass-card {
      background: rgba(8, 20, 14, 0.92) !important;
      border-color: rgba(34, 197, 94, 0.15) !important;
    }
    html.night-shift .input-field {
      background: #0a1a12 !important;
      border-color: #1a3d2a !important;
      color: #e8f5e9 !important;
      font-size: 16px !important;
    }
    html.night-shift .data th { background: #0d4d2e !important; }
    html.night-shift .btn-primary { filter: saturate(1.1); }

    @keyframes chartSlideIn {
      from { opacity: 0; transform: translateX(18px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .chart-slide-in {
      animation: chartSlideIn 0.45s ease-out;
    }
    .chat-badge {
      display: inline-flex; align-items: center; justify-content: center;
      min-width: 1.1rem; height: 1.1rem; padding: 0 0.25rem;
      margin-right: 0.25rem; border-radius: 999px;
      background: #ef4444; color: #fff; font-size: 0.65rem; font-weight: 700;
    }
    .chat-badge.hidden { display: none !important; }
  </style>
</head>
<body class="text-slate-100 antialiased">
  <div id="cdn-warn">ظاهر کامل (Tailwind) لود نشد — با CSS محلی ادامه می‌دهید. اگر صفحه سفید است یک‌بار با اینترنت موبایل باز کنید.</div>
  <!-- Login Screen -->
  <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
    <div class="glass rounded-3xl p-8 w-full max-w-md shadow-2xl fade-in">
      <div class="text-center mb-8">
        <img src="logo-ansar.png" alt="غذای انصار" class="w-28 h-auto mx-auto mb-4 rounded-2xl shadow-lg border border-brand-700/40" />
        <h1 class="text-2xl font-bold text-cream-100 tracking-tight">غذای انصار</h1>
        <p class="text-brand-300 mt-1.5 text-sm">سیستم گردش مواد اولیه و تولید</p>
      </div>
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-sm text-slate-400 mb-1.5">نام کاربری</label>
          <input type="text" id="login-user" class="input-field" placeholder="نام کاربری" required autocomplete="username" />
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1.5">رمز عبور</label>
          <input type="password" id="login-pass" class="input-field" placeholder="رمز عبور" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn-primary w-full mt-2">ورود به سیستم</button>
      </form>
      <div id="cloud-status" class="mt-6 pt-4 border-t border-slate-700/50 text-xs text-center text-slate-500">
        در حال بررسی اتصال ابری...
      </div>
    </div>
  </div>

  <!-- نوار بالای موبایل: وضعیت اتصال + خروج -->
  <div id="mobile-topbar">
    <div class="conn-status local" id="mobile-conn-status">
      <span class="dot"></span>
      <span id="mobile-conn-text">در حال بررسی...</span>
    </div>
    <div class="mob-actions">
      <button type="button" onclick="Pages.toggleNightMode()" title="شیفت شب">🌙</button>
      <button type="button" class="logout-btn" onclick="logout()">خروج</button>
    </div>
  </div>

  <!-- Main App -->
  <div id="app" class="hidden min-h-screen flex">
    <aside id="sidebar" class="w-64 glass border-l border-slate-700/40 flex flex-col fixed right-0 top-0 bottom-0 z-40">
      <div class="p-5 border-b border-slate-700/40">
        <div class="flex items-center gap-3">
          <img src="logo-ansar.png" alt="غذای انصار" class="w-10 h-10 rounded-xl object-cover border border-brand-600/40" />
          <div>
            <div class="font-bold text-sm text-cream-100">غذای انصار</div>
            <div class="text-xs text-brand-400" id="user-role-label">—</div>
          </div>
        </div>
      </div>
      <nav class="flex-1 p-3 space-y-1 overflow-y-auto" id="nav-links"></nav>
      <div class="p-4 border-t border-slate-700/40 space-y-2">

  <script>
    // Service Worker روی اینترنت مخابرات با ERR_CONNECTION_RESET تداخل دارد — غیرفعال
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.unregister(); });
        });
        if (window.caches) {
          caches.keys().then(function (keys) {
            keys.forEach(function (k) { caches.delete(k); });
          });
        }
        if (localStorage.getItem('kitchen_night_shift') === '1') {
          document.documentElement.classList.add('night-shift');
        }
      });
    }
  </script>
